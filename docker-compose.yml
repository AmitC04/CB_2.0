services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/jeevansetu.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001,http://127.0.0.1:3000}
      # Empty by default: the loopback demo runs with no token. See docs/DEPLOYMENT.md.
      API_TOKEN: ${API_TOKEN:-}
      # Empty locally: seed explicitly with scripts/seed_demo.py instead.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Used only when NEXT_PUBLIC_API_URL is set to /api/backend for a hosted deployment.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      API_TOKEN: ${API_TOKEN:-}
      # Empty locally, so the shared-credential gate stays inert. See docs/DEPLOYMENT.md.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      PUBLIC_DEPLOYMENT: ${PUBLIC_DEPLOYMENT:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
